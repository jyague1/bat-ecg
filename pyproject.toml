[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batecg"
version = "0.1.0"
description = "BAT (Biomedical Analysis Toolbox): a command-line biomedical signal processing toolbox driven by declarative YAML protocols."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click",
    "pydantic>=2.0",
    "pyyaml",
    "wfdb",
    "onnx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
bat = "bat.cli:main"

[project.entry-points."bat.plugins"]
core = "bat.core"

[tool.hatch.build.targets.wheel]
packages = ["src/bat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors/warnings (E/W), isort (I),
# pyupgrade (UP), flake8-bugbear (B).
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests build many small inline protocols/modules; long lines and a few
# intentionally-unused fixtures are fine there.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
# Pragmatic starting point: check what we can without demanding full
# annotations everywhere. Tighten over time.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
